<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Regalo para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;font-family:'Segoe UI',sans-serif}
#p1{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:.9s cubic-bezier(.8,0,.2,1)}
#p1.hide{transform:translateY(-110%)}
h1{color:white;font-size:2.6rem;line-height:1} h1 span{color:#ffeb3b}
input{background:#111;border:1px solid #222;color:white;padding:18px 25px;border-radius:50px;width:100%;max-width:320px;font-size:18px;text-align:center;margin-top:30px;outline:none}
input:focus{border-color:#ffeb3b}
.btn{background:#ffeb3b;color:#000;border:none;padding:16px 50px;border-radius:50px;font-weight:900;font-size:18px;margin-top:20px;cursor:pointer}

#p2{position:fixed;inset:0;background:#000}

.flor-grande{position:absolute;transform:translate(-50%,-50%) scale(0);animation:florecer 1.2s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes florecer{to{transform:translate(-50%,-50%) scale(1)}}
.petal{position:absolute;width:70px;height:100px;background:#ffeb3b;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;left:50%;top:0;transform-origin:35px 90px;box-shadow:inset -8px -8px 15px rgba(0,0,0,.2)}
.centro{position:absolute;width:44px;height:44px;background:radial-gradient(circle,#5d4037,#3e2723);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;box-shadow:0 0 20px rgba(0,0,0,.8)}

.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.92);border:1px solid rgba(255,235,59,.25);backdrop-filter:blur(12px);padding:32px 26px;border-radius:28px;max-width:360px;width:90%;text-align:center;z-index:10;display:none;box-shadow:0 0 60px rgba(0,0,0,1)}
.card.show{display:block;animation:cardIn.8s.3s both}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
.card h2{color:#ffeb3b;font-size:30px}
.card p{color:#e0e0e0;margin-top:16px;line-height:1.6;font-size:17px}
</style>
</head>
<body>

<div id="p1">
<div style="font-size:65px">🎁</div>
<h1>Tengo un<br><span>regalo</span><br>para vos</h1>
<p style="color:#666;margin-top:10px">Escribí tu nombre para abrirlo</p>
<input id="nombre" type="text" placeholder="Tu nombre..." maxlength="20">
<button class="btn" onclick="abrir()">ABRIR 💛</button>
</div>

<div id="p2"></div>

<div class="card" id="card">
<h2>🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto"></p>
</div>

<script>
function crearFlor(x,y, delay=0, size=1){
 setTimeout(()=>{
  const cont=document.createElement('div');
  cont.className='flor-grande';
  cont.style.left=x+'%'; cont.style.top=y+'%';
  cont.style.setProperty('--s', size);
  cont.style.transform=`translate(-50%,-50%) scale(0)`;

  for(let i=0;i<6;i++){
   let p=document.createElement('div');
   p.className='petal';
   p.style.transform=`translateX(-50%) rotate(${i*60}deg)`;
   p.style.width=(70*size)+'px'; p.style.height=(100*size)+'px';
   p.style.transformOrigin=`${35*size}px ${90*size}px`;
   cont.appendChild(p);
  }
  let c=document.createElement('div');
  c.className='centro';
  c.style.width=(44*size)+'px'; c.style.height=(44*size)+'px';
  cont.appendChild(c);

  document.getElementById('p2').appendChild(cont);
 }, delay);
}

function abrir(){
 let n=document.getElementById('nombre').value.trim();
 if(n.length<2){document.getElementById('nombre').style.borderColor='red';return;}

 document.getElementById('p1').classList.add('hide');

 // Mensaje con el nombre adentro como pediste
 document.getElementById('texto').innerHTML = `<b style="color:white;font-size:20px">${n},</b><br><br>que tengas un lindo día de la primavera, lleno de sol, de risas y de cosas lindas.<br><br>Te merecés todo lo bonito que florece hoy y siempre. 💛`;

 // Hace florecer flores grandes de la nada
 const posiciones = [
  [20,25,1.1], [80,20,1.2], [50,35,1.4],
  [15,70,1.0], [85,75,1.1], [30,50,0.9],
  [70,55,1.0], [50,80,1.3], [50,15,0.8]
 ];
 posiciones.forEach((p,i)=>{
  crearFlor(p[0], p[1], i*250, p[2]);
 });

 setTimeout(()=>{
  document.getElementById('card').classList.add('show');
  // siguen floreciendo más atrás
  setInterval(()=>{
   crearFlor(Math.random()*100, Math.random()*100, 0, 0.6+Math.random()*0.7);
  }, 800);
 }, 1200);
}
</script>
</body>
</html>
