<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
#p1{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:.8s}
#p1.hide{transform:translateY(-110%)}
h1{color:white;font-size:2.6rem} h1 span{color:#ffeb3b}
input{background:#111;border:1px solid #333;color:white;padding:16px 24px;border-radius:40px;max-width:300px;width:100%;text-align:center;font-size:18px;margin-top:25px;outline:none}
.btn{background:#ffeb3b;color:#000;border:none;padding:14px 45px;border-radius:40px;font-weight:900;margin-top:18px;cursor:pointer;box-shadow:0 0 20px rgba(255,235,59,.4)}

#escena{position:fixed;inset:0;background:#000;display:none}
#escena.show{display:block}

.jardin{position:absolute;inset:0;z-index:1;overflow:hidden}
.flower{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;transform-origin:bottom center;will-change:transform}
.tallo{width:8px;background:linear-gradient(to top,#134a13,#4caf50);position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-radius:4px}
.flower-head{position:absolute;width:90px;height:90px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center}
.petal{position:absolute;width:32px;height:52px;background:linear-gradient(to bottom,#ffeb3b,#fbc02d);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;left:50%;top:50%;transform-origin:16px 36px}
.center{position:absolute;width:28px;height:28px;background:#3e2723;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10}
.leaf{position:absolute;width:50px;height:22px;background:#2e7d32;border-radius:0 100% 0 100%;left:10px}
.leaf.left{border-radius:100% 0 100% 0;left:auto;right:10px}
.pasto{position:absolute;bottom:0;left:0;right:0;height:110px;background:linear-gradient(to top,#081a08,#1a4d1a);z-index:2}

/* MENSAJE SIEMPRE ARRIBA DE TODO */
.mensaje{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.94);border:1px solid rgba(255,235,59,.5);backdrop-filter:blur(20px);padding:32px 28px;border-radius:26px;width:88%;max-width:380px;text-align:center;z-index:9999;display:none;color:#eee;line-height:1.5;box-shadow:0 0 100px rgba(0,0,0,1),0 0 30px rgba(255,235,59,.15)}
.mensaje.show{display:block;animation:aparecer .9s both}
@keyframes aparecer{from{opacity:0;transform:translate(-50%,-40%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes crecer{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes bloom{0%{transform:translateX(-50%) scale(0) rotate(0deg)}100%{transform:translateX(-50%) scale(1) rotate(360deg)}}

#musicBtn{position:fixed;top:18px;right:18px;z-index:10000;background:rgba(20,20,20,.9);border:1px solid #ffeb3b;color:#ffeb3b;width:48px;height:48px;border-radius:50%;display:none;cursor:pointer;font-size:20px}
#musicBtn.show{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div id="p1">
<div style="font-size:60px">🎁</div>
<h1>Tengo un<br><span>regalo</span><br>para vos</h1>
<input id="nombre" placeholder="Escribí tu nombre...">
<button class="btn" onclick="abrir()">ABRIR 💛</button>
<p style="color:#333;margin-top:15px;font-size:11px">🔊 CON MÚSICA</p>
</div>

<div id="escena">
<div class="jardin" id="jardin"></div>
<div class="pasto"></div>

<div class="mensaje" id="mensaje">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto" style="margin-top:14px;font-size:17px"></p>
</div>

<button id="musicBtn" onclick="toggleMusic()">🎵</button>
</div>

<!-- MUSICA FLORICIENTA ORIGINAL -->
<audio id="musica" loop preload="auto">
<source src="https://ia800905.us.archive.org/34/items/flores-amarillas-floricienta/Flores%20Amarillas%20-%20Floricienta.mp3" type="audio/mpeg">
</audio>

<script>
let playing=false;
const jardin=document.getElementById('jardin');
function toggleMusic(){
 let a=document.getElementById('musica');
 if(playing){a.pause(); musicBtn.innerText='🔇';} else{a.play(); musicBtn.innerText='🎵';}
 playing=!playing;
}
function crearFlor(x, altura, delay){
 const cont=document.createElement('div');
 cont.className='flower';
 cont.style.left=x+'%';
 cont.style.bottom='0px';
 cont.style.height=altura+'px';
 cont.style.zIndex=Math.floor(altura/10);
 cont.style.animation=`crecer 0.8s ${delay}s both`;
 const tallo=document.createElement('div');
 tallo.className='tallo'; tallo.style.height=altura+'px';
 let leaf1=document.createElement('div'); leaf1.className='leaf left'; leaf1.style.bottom=(altura*0.35)+'px'; tallo.appendChild(leaf1);
 let leaf2=document.createElement('div'); leaf2.className='leaf'; leaf2.style.bottom=(altura*0.6)+'px'; tallo.appendChild(leaf2);
 const head=document.createElement('div');
 head.className='flower-head';
 head.style.bottom=(altura-12)+'px';
 head.style.animation=`bloom 0.7s ${delay+0.6}s both`;
 for(let i=0;i<6;i++){
  let petal=document.createElement('div');
  petal.className='petal';
  petal.style.transform=`translate(-50%,-50%) rotate(${i*60}deg) translateY(-18px)`;
  head.appendChild(petal);
 }
 let center=document.createElement('div'); center.className='center'; head.appendChild(center);
 cont.appendChild(head); cont.appendChild(tallo);
 jardin.appendChild(cont);
 // Borrar flores viejas para que no se trabe el cel
 setTimeout(()=>{if(jardin.children.length>60){jardin.firstChild.remove()}}, 10000);
}

function abrir(){
 let n=document.getElementById('nombre').value.trim();
 if(n.length<2){document.getElementById('nombre').style.borderColor='red';return;}
 document.getElementById('p1').classList.add('hide');
 document.getElementById('escena').classList.add('show');
 document.getElementById('musicBtn').classList.add('show');
 document.getElementById('texto').innerHTML=`<b style="color:white;font-size:23px">${n},</b><br><br>que tengas un lindo día de la primavera, que hoy todo lo lindo florezca para vos.<br><br>Te merecés cada flor amarilla de este jardín y mucho más 💛🌻`;

 let audio=document.getElementById('musica');
 audio.volume=0.8;
 audio.play().then(()=>{playing=true; musicBtn.innerText='🎵';}).catch(()=>{
  // si el navegador bloquea, queda el boton para activar
  musicBtn.innerText='🔇';
 });

 // 30 flores de entrada por toda la pantalla
 for(let i=0;i<30;i++){
  crearFlor(2+Math.random()*96, 120+Math.random()*300, Math.random()*1.5);
 }
 setTimeout(()=>document.getElementById('mensaje').classList.add('show'), 1800);

 // INFINITAS - cada 350ms nace una nueva
 setInterval(()=>{
  crearFlor(Math.random()*100, 120+Math.random()*300, 0);
 }, 350);
}
</script>
</body>
</html>
