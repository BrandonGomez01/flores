<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
.pantalla{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:.6s}
.pantalla.hide{transform:translateY(-110%);pointer-events:none}
h1{color:white;font-size:2.4rem;line-height:1.1} h1 span{color:#ffeb3b}
input{background:#111;border:1px solid #333;color:white;padding:16px 24px;border-radius:40px;max-width:300px;width:100%;text-align:center;font-size:18px;margin-top:24px;outline:none;pointer-events:auto;position:relative;z-index:10}
.btn{background:#ffeb3b;color:#000;border:none;padding:16px 42px;border-radius:40px;font-weight:900;margin-top:18px;cursor:pointer;pointer-events:auto;position:relative;z-index:10}
.btn2{background:#ffeb3b;color:#000;border:none;padding:14px 28px;border-radius:40px;font-weight:700;margin-top:20px;cursor:pointer;pointer-events:auto;position:relative;z-index:10}

#escena{position:fixed;inset:0;background:#000;display:none}
#escena.show{display:block}

/* FLORES - NO TAPAN CLICKS EN NOTEBOOK */
.jardin{position:absolute;inset:0;z-index:1;pointer-events:none}
.flower{position:absolute;bottom:0;transform-origin:bottom;pointer-events:none}
.tallo{width:6px;background:linear-gradient(to top,#134a13,#4caf50);position:absolute;bottom:0;left:50%;transform:translateX(-50%);pointer-events:none}
.flower-head{position:absolute;width:68px;height:68px;left:50%;transform:translateX(-50%);pointer-events:none}
.petal{position:absolute;width:24px;height:38px;background:#ffeb3b;border-radius:50% 50% / 60% 60%;left:50%;top:50%;transform-origin:12px 24px;pointer-events:none}
.center{position:absolute;width:20px;height:20px;background:#3e2723;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none}
.leaf{position:absolute;width:38px;height:16px;background:#2e7d32;border-radius:0 100% 0 100%;left:7px;pointer-events:none}
.leaf.left{border-radius:100% 0 100% 0;right:7px;left:auto}
.pasto{position:absolute;bottom:0;left:0;right:0;height:90px;background:#0f2e0f;z-index:2;pointer-events:none}

/* MENSAJE SIEMPRE ARRIBA */
.mensaje{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.96);border:1px solid rgba(255,235,59,.5);padding:28px 24px;border-radius:24px;width:90%;max-width:360px;text-align:center;z-index:9999;color:#eee;transition:all .8s cubic-bezier(.4,0,.2,1);pointer-events:auto;box-shadow:0 0 80px black}
.mensaje.mini{top:16px;transform:translateX(-50%) scale(.85);padding:14px 16px;border-radius:18px}
.mensaje.mini h2{font-size:16px}
.mensaje.mini p{font-size:13px !important;margin-top:6px !important}

@keyframes crecer{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bloom{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}

#musicBtn{position:fixed;top:16px;right:16px;z-index:10000;background:rgba(20,20,20,.9);border:1px solid #ffeb3b;color:#ffeb3b;width:46px;height:46px;border-radius:50%;display:none;cursor:pointer;pointer-events:auto}
#musicBtn.show{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="pantalla" id="p1">
<div style="font-size:56px">🎁</div>
<h1>Tengo un<br><span>regalo</span><br>para vos</h1>
<input id="nombre" placeholder="Tu nombre..." maxlength="18" autocomplete="off">
<button class="btn" onclick="paso2()">ABRIR 💛</button>
</div>

<div class="pantalla" id="p2" style="transform:translateY(110%);z-index:90">
<div class="mensaje" style="position:relative;transform:none;left:auto;top:auto;display:block;z-index:10">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto" style="margin-top:14px;font-size:17px"></p>
<button class="btn2" onclick="paso3()">Ver tu jardín infinito 🎵</button>
</div>
</div>

<div id="escena">
<div class="jardin" id="jardin"></div>
<div class="pasto"></div>
<div class="mensaje" id="mensajeFinal" style="display:none">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto2" style="margin-top:10px;font-size:17px"></p>
<p style="color:#666;font-size:10px;margin-top:8px;cursor:pointer" onclick="this.parentElement.style.display='none'">tocá para ocultar</p>
</div>
<button id="musicBtn" onclick="toggleMusic()">🎵</button>
</div>

<!-- MUSICA - PONÉ flores.mp3 AL LADO DEL INDEX.HTML EN GITHUB -->
<audio id="musica" loop preload="auto" playsinline>
  <source src="./flores.mp3" type="audio/mpeg">
  <source src="https://files.catbox.moe/1r5k1z.mp3" type="audio/mpeg">
</audio>

<script>
let playing=false;
let jardin=document.getElementById('jardin');
let textoGlobal="";

function paso2(){
 let n=document.getElementById('nombre').value.trim();
 if(n.length<2){document.getElementById('nombre').style.borderColor='red';return;}
 textoGlobal=`<b style="color:white;font-size:22px">${n},</b><br><br>que tengas un lindo día de la primavera, que hoy todo lo lindo florezca para vos.<br><br>Te merecés cada flor amarilla de este jardín y mucho más 💛🌻`;
 document.getElementById('texto').innerHTML=textoGlobal;
 document.getElementById('p1').classList.add('hide');
 document.getElementById('p2').style.transform='translateY(0)';
}

function crearFlor(x, altura, delay){
 const c=document.createElement('div'); 
 c.className='flower'; 
 c.style.left=x+'%'; 
 c.style.bottom='0'; 
 c.style.height=altura+'px'; 
 c.style.animation=`crecer .7s ${delay}s both`; 
 c.style.transformOrigin='bottom';
 const tallo=document.createElement('div'); tallo.className='tallo'; tallo.style.height=altura+'px';
 let l1=document.createElement('div'); l1.className='leaf left'; l1.style.bottom=(altura*0.35)+'px'; tallo.appendChild(l1);
 let l2=document.createElement('div'); l2.className='leaf'; l2.style.bottom=(altura*0.6)+'px'; tallo.appendChild(l2);
 const head=document.createElement('div'); head.className='flower-head'; head.style.bottom=(altura-10)+'px'; head.style.animation=`bloom .6s ${delay+0.5}s both`;
 for(let i=0;i<6;i++){let p=document.createElement('div'); p.className='petal'; p.style.transform=`translate(-50%,-50%) rotate(${i*60}deg) translateY(-12px)`; head.appendChild(p);}
 let ce=document.createElement('div'); ce.className='center'; head.appendChild(ce);
 c.appendChild(head); c.appendChild(tallo); jardin.appendChild(c);
 if(jardin.children.length>60) jardin.firstChild.remove();
}

function paso3(){
 document.getElementById('p2').classList.add('hide');
 document.getElementById('escena').classList.add('show');
 document.getElementById('texto2').innerHTML=textoGlobal;
 let msg=document.getElementById('mensajeFinal'); 
 msg.style.display='block';
 document.getElementById('musicBtn').classList.add('show');

 let audio=document.getElementById('musica');
 audio.volume=0.9;
 audio.play().then(()=>{playing=true; musicBtn.innerText='🎵';}).catch(()=>{musicBtn.innerText='🔇';});

 for(let i=0;i<30;i++) crearFlor(2+Math.random()*96, 110+Math.random()*220, Math.random()*1.2);
 setInterval(()=>crearFlor(Math.random()*100, 110+Math.random()*220, 0), 320);

 setTimeout(()=>{msg.classList.add('mini');}, 2500);
}

function toggleMusic(){
 let a=document.getElementById('musica');
 if(playing){a.pause(); musicBtn.innerText='🔇';}else{a.play(); musicBtn.innerText='🎵';}
 playing=!playing;
}
</script>
</body>
</html>
