<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif}
#p1{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:.8s}
#p1.hide{transform:translateY(-110%)}
h1{color:white;font-size:2.6rem} h1 span{color:#ffeb3b}
input{background:#111;border:1px solid #333;color:white;padding:16px 24px;border-radius:40px;max-width:300px;width:100%;text-align:center;font-size:18px;margin-top:25px;outline:none}
.btn{background:#ffeb3b;color:#000;border:none;padding:14px 45px;border-radius:40px;font-weight:900;margin-top:18px;cursor:pointer}

#escena{position:fixed;inset:0;background:#000;display:none}
#escena.show{display:block}

/* FLORES BIEN ARMADAS */
.jardin{position:absolute;inset:0;z-index:1}
.flower{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;transform-origin:bottom center}
.tallo{width:8px;background:linear-gradient(to top,#134a13,#4caf50);position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-radius:4px}
.flower-head{position:absolute;width:90px;height:90px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center}
.petal{position:absolute;width:32px;height:52px;background:linear-gradient(to bottom,#ffeb3b,#fbc02d);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;left:50%;top:50%;transform-origin:16px 36px}
.center{position:absolute;width:28px;height:28px;background:#3e2723;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;box-shadow:inset 0 2px 5px rgba(0,0,0,.8)}
.leaf{position:absolute;width:50px;height:22px;background:#2e7d32;border-radius:0 100% 0 100%;left:10px}
.leaf.left{border-radius:100% 0 100% 0;left:auto;right:10px}

.pasto{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(to top,#081a08,#1a4d1a);z-index:2}

/* MENSAJE SIEMPRE ARRIBA */
.mensaje{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.92);border:1px solid rgba(255,235,59,.4);backdrop-filter:blur(20px);padding:32px 28px;border-radius:26px;width:88%;max-width:380px;text-align:center;z-index:50;display:none;color:#eee;line-height:1.5;box-shadow:0 0 80px black}
.mensaje.show{display:block;animation:aparecer .8s both}
@keyframes aparecer{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}

@keyframes crecer{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes bloom{0%{transform:translateX(-50%) scale(0)}100%{transform:translateX(-50%) scale(1)}}

#musicBtn{position:fixed;top:18px;right:18px;z-index:60;background:rgba(255,255,255,.1);border:1px solid #ffeb3b;color:#ffeb3b;width:46px;height:46px;border-radius:50%;display:none;cursor:pointer}
#musicBtn.show{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div id="p1">
<div style="font-size:60px">🎁</div>
<h1>Tengo un<br><span>regalo</span><br>para vos</h1>
<input id="nombre" placeholder="Escribí tu nombre...">
<button class="btn" onclick="abrir()">ABRIR 💛</button>
</div>

<div id="escena">
<div class="jardin" id="jardin"></div>
<div class="pasto"></div>

<div class="mensaje" id="mensaje">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto" style="margin-top:14px;font-size:17px"></p>
</div>

<button id="musicBtn" onclick="toggleMusic()">🎵</button>
</div>

<audio id="musica" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a650f7.mp3?filename=flores-amarillas-instrumental-111199.mp3" type="audio/mpeg">
</audio>

<script>
let playing=false;
function toggleMusic(){
 let a=document.getElementById('musica');
 if(playing){a.pause(); musicBtn.innerText='🔇';} else{a.play(); musicBtn.innerText='🎵';}
 playing=!playing;
}

function crearFlor(x, altura, delay){
 const cont=document.createElement('div');
 cont.className='flower';
 cont.style.left=x+'%';
 cont.style.bottom='0px';
 cont.style.height=altura+'px';
 cont.style.zIndex=Math.floor(altura);
 cont.style.animation=`crecer 1s ${delay}s both`;
 cont.style.transformOrigin='bottom';

 const tallo=document.createElement('div');
 tallo.className='tallo';
 tallo.style.height=altura+'px';

 // hojas
 let leaf1=document.createElement('div'); leaf1.className='leaf left';
 leaf1.style.bottom=(altura*0.35)+'px'; tallo.appendChild(leaf1);
 let leaf2=document.createElement('div'); leaf2.className='leaf';
 leaf2.style.bottom=(altura*0.6)+'px'; tallo.appendChild(leaf2);

 const head=document.createElement('div');
 head.className='flower-head';
 head.style.bottom=(altura-10)+'px';
 head.style.animation=`bloom 0.8s ${delay+0.8}s both`;

 for(let i=0;i<6;i++){
  let petal=document.createElement('div');
  petal.className='petal';
  petal.style.transform=`translate(-50%,-50%) rotate(${i*60}deg) translateY(-18px)`;
  head.appendChild(petal);
 }
 let center=document.createElement('div'); center.className='center'; head.appendChild(center);

 cont.appendChild(head);
 cont.appendChild(tallo);
 document.getElementById('jardin').appendChild(cont);
}

function abrir(){
 let n=document.getElementById('nombre').value.trim();
 if(n.length<2){nombre.style.borderColor='red';return;}
 p1.classList.add('hide');
 escena.classList.add('show');
 musicBtn.classList.add('show');
 texto.innerHTML=`<b style="color:white;font-size:22px">${n},</b><br><br>que tengas un lindo día de la primavera, que hoy todo lo lindo florezca para vos.<br><br>Te merecés cada flor amarilla de este jardín y mucho más 💛🌻`;

 let audio=document.getElementById('musica'); audio.volume=0.7; audio.play().then(()=>playing=true).catch(()=>{});

 // 25 flores por toda la pantalla
 for(let i=0;i<25;i++){
  let x = 5 + Math.random()*90;
  let altura = 150 + Math.random()*280;
  let delay = Math.random()*2;
  crearFlor(x, altura, delay);
 }
 setTimeout(()=>mensaje.classList.add('show'), 2400);
}
</script>
</body>
</html>
