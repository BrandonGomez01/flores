<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;overflow:hidden;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
.pantalla{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:.7s}
.pantalla.hide{transform:translateY(-110%);opacity:0}
h1{color:white;font-size:2.4rem;line-height:1.1} h1 span{color:#ffeb3b}
input{background:#111;border:1px solid #333;color:white;padding:16px 24px;border-radius:40px;max-width:300px;width:100%;text-align:center;font-size:18px;margin-top:24px;outline:none}
.btn{background:#ffeb3b;color:#000;border:none;padding:16px 42px;border-radius:40px;font-weight:900;margin-top:18px;cursor:pointer;font-size:17px}
.btn2{background:transparent;color:#ffeb3b;border:1px solid #ffeb3b;padding:14px 32px;border-radius:40px;font-weight:700;margin-top:22px;cursor:pointer}

#escena{position:fixed;inset:0;background:#000;display:none}
#escena.show{display:block}
.jardin{position:absolute;inset:0;z-index:1}
.flower{position:absolute;bottom:0}
.tallo{width:6px;background:linear-gradient(to top,#134a13,#4caf50);position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-radius:4px}
.flower-head{position:absolute;width:70px;height:70px;left:50%;transform:translateX(-50%)}
.petal{position:absolute;width:26px;height:42px;background:#ffeb3b;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;left:50%;top:50%;transform-origin:13px 28px;box-shadow:inset -2px -2px 4px rgba(0,0,0,.2)}
.center{position:absolute;width:22px;height:22px;background:#3e2723;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
.leaf{position:absolute;width:40px;height:18px;background:#2e7d32;border-radius:0 100% 0 100%;left:8px}
.leaf.left{border-radius:100% 0 100% 0;right:8px;left:auto}
.pasto{position:absolute;bottom:0;left:0;right:0;height:90px;background:#0f2e0f;z-index:2}

/* MENSAJE SIEMPRE ARRIBA */
.mensaje{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.96);border:1px solid rgba(255,235,59,.45);padding:28px 24px;border-radius:24px;width:90%;max-width:360px;text-align:center;z-index:9999;color:#eee;line-height:1.5;box-shadow:0 0 80px black}
#mensaje2.mensaje{width:92%;max-width:380px}

@keyframes crecer{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bloom{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}

#musicBtn{position:fixed;top:16px;right:16px;z-index:10000;background:rgba(20,20,20,.9);border:1px solid #ffeb3b;color:#ffeb3b;width:46px;height:46px;border-radius:50%;display:none;cursor:pointer}
#musicBtn.show{display:flex;align-items:center;justify-content:center}

@media(max-width:600px){
 .flower-head{width:60px;height:60px}
 .petal{width:22px;height:36px;transform-origin:11px 24px}
 .center{width:18px;height:18px}
 .tallo{width:5px}
}
</style>
</head>
<body>

<!-- PASO 1 - NOMBRE -->
<div class="pantalla" id="p1">
<div style="font-size:56px">🎁</div>
<h1>Tengo un<br><span>regalo</span> para vos</h1>
<input id="nombre" placeholder="Tu nombre..." maxlength="18">
<button class="btn" onclick="mostrarMensaje()">ABRIR 💛</button>
</div>

<!-- PASO 2 - SOLO MENSAJE (SE VE PERFECTO EN CELU) -->
<div class="pantalla" id="p2" style="transform:translateY(110%)">
<div class="mensaje" style="position:relative;transform:none;left:auto;top:auto;z-index:1;display:block">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto" style="margin-top:14px;font-size:17px"></p>
<button class="btn2" onclick="verJardin()">Ver tu jardín infinito 💛</button>
<p style="color:#555;font-size:11px;margin-top:12px">🔊 toca para música</p>
</div>
</div>

<!-- PASO 3 - FLORES INFINITAS + MENSAJE ARRIBA -->
<div id="escena">
<div class="jardin" id="jardin"></div>
<div class="pasto"></div>
<div class="mensaje" id="mensajeFinal" style="display:none">
<h2 style="color:#ffeb3b">🌻 ¡Feliz Primavera! 🌻</h2>
<p id="texto2" style="margin-top:14px;font-size:17px"></p>
</div>
<button id="musicBtn" onclick="toggleMusic()">🎵</button>
</div>

<audio id="musica" loop preload="auto" playsinline>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" id="audioSrc">
</audio>

<script>
let playing=false;
const jardin=document.getElementById('jardin');
let textoGlobal="";

function mostrarMensaje(){
 let n=document.getElementById('nombre').value.trim();
 if(n.length<2){document.getElementById('nombre').style.borderColor='red';return;}
 textoGlobal=`<b style="color:white;font-size:22px">${n},</b><br><br>que tengas un lindo día de la primavera, que hoy todo lo lindo florezca para vos.<br><br>Te merecés cada flor amarilla de este jardín y mucho más 💛🌻`;
 document.getElementById('texto').innerHTML=textoGlobal;
 document.getElementById('p1').classList.add('hide');
 document.getElementById('p2').style.transform='translateY(0)';
}

function crearFlor(x, altura, delay){
 const cont=document.createElement('div');
 cont.className='flower';
 cont.style.left=x+'%'; cont.style.bottom='0'; cont.style.height=altura+'px';
 cont.style.animation=`crecer .7s ${delay}s both`; cont.style.transformOrigin='bottom';
 const tallo=document.createElement('div'); tallo.className='tallo'; tallo.style.height=altura+'px';
 let l1=document.createElement('div'); l1.className='leaf left'; l1.style.bottom=(altura*0.35)+'px'; tallo.appendChild(l1);
 let l2=document.createElement('div'); l2.className='leaf'; l2.style.bottom=(altura*0.6)+'px'; tallo.appendChild(l2);
 const head=document.createElement('div'); head.className='flower-head'; head.style.bottom=(altura-10)+'px'; head.style.animation=`bloom .6s ${delay+0.5}s both`;
 for(let i=0;i<6;i++){let p=document.createElement('div'); p.className='petal'; p.style.transform=`translate(-50%,-50%) rotate(${i*60}deg) translateY(-14px)`; head.appendChild(p);}
 let c=document.createElement('div'); c.className='center'; head.appendChild(c);
 cont.appendChild(head); cont.appendChild(tallo); jardin.appendChild(cont);
 if(jardin.children.length>55){jardin.firstChild.remove();}
}

function verJardin(){
 document.getElementById('p2').classList.add('hide');
 document.getElementById('escena').classList.add('show');
 document.getElementById('musicBtn').classList.add('show');
 document.getElementById('texto2').innerHTML=textoGlobal;
 document.getElementById('mensajeFinal').style.display='block';

 // CAMBIA ESTA URL POR LA DE FLORICIENTA REAL
 // Subí el mp3 a https://catbox.moe/ y pega el link directo acá abajo
 document.getElementById('audioSrc').src="https://ia800905.us.archive.org/34/items/flores-amarillas-floricienta/Flores%20Amarillas%20-%20Floricienta.mp3";
 document.getElementById('musica').load();

 let audio=document.getElementById('musica');
 audio.volume=0.85;
 audio.play().then(()=>{playing=true; musicBtn.innerText='🎵';}).catch(e=>{
   musicBtn.innerText='🔇';
   console.log("Autoplay bloqueado, toca el boton");
 });

 // Flores infinitas
 for(let i=0;i<28;i++){crearFlor(2+Math.random()*96, 100+Math.random()*220, Math.random()*1.2);}
 setInterval(()=>{crearFlor(Math.random()*100, 100+Math.random()*220, 0);}, 300);
}

function toggleMusic(){
 let a=document.getElementById('musica');
 if(playing){a.pause(); musicBtn.innerText='🔇';} else{a.play(); musicBtn.innerText='🎵';}
 playing=!playing;
}
</script>
</body>
</html>
