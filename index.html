<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Regalo para vos 💛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:white;font-family:'Segoe UI',sans-serif;height:100vh;overflow:hidden}
#p1{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;transition:.8s}
#p1.hide{transform:translateY(-100%);opacity:0}
h1{font-size:2.5rem;line-height:1.1}
h1 span{color:#ffeb3b}
input{background:#111;border:1px solid #333;color:white;padding:18px 25px;border-radius:50px;width:100%;max-width:320px;font-size:18px;text-align:center;margin-top:30px;outline:none}
input:focus{border-color:#ffeb3b;box-shadow:0 0 20px rgba(255,235,59,.3)}
.btn{background:#ffeb3b;color:#000;border:none;padding:16px 50px;border-radius:50px;font-weight:900;font-size:18px;margin-top:20px;cursor:pointer;box-shadow:0 0 30px rgba(255,235,59,.5)}
#p2{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center}
#p2.show{display:flex}
.ramo{position:absolute;font-size:40px;animation:flotar 3s ease-out forwards;user-select:none}
@keyframes flotar{0%{transform:translateY(110vh) scale(0) rotate(0deg);opacity:0}20%{opacity:1}100%{transform:translateY(-20vh) scale(1.2) rotate(360deg);opacity:0}}
.card{background:rgba(20,20,20,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,235,59,.3);padding:35px 28px;border-radius:30px;max-width:360px;text-align:center;z-index:5;box-shadow:0 0 50px rgba(255,235,59,.15);animation:aparecer 1s .5s both}
@keyframes aparecer{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{color:#ffeb3b;font-size:28px}
.card p{margin-top:15px;line-height:1.6;font-size:16px;color:#ddd}
.card b{color:white}
.de{margin-top:20px;font-size:13px;letter-spacing:2px;opacity:.5;text-transform:uppercase}
</style>
</head>
<body>

<div id="p1">
<div style="font-size:60px;animation:latir 1.5s infinite">🎁</div>
<h1>Tengo un<br><span>regalo</span> para vos</h1>
<p style="opacity:.6;margin-top:10px">Escribí tu nombre para abrirlo</p>
<input id="nombre" type="text" placeholder="Tu nombre aquí..." maxlength="20">
<button class="btn" onclick="abrir()">ABRIR 💛</button>
</div>

<div id="p2">
<div class="card" id="card">
<h2>¡Feliz Primavera! 🌻</h2>
<p id="texto"></p>
<div class="de" id="de"></div>
</div>
</div>

<script>
function abrir(){
 const n = document.getElementById('nombre').value.trim();
 if(n.length < 2){document.getElementById('nombre').style.borderColor='red'; return;}
 document.getElementById('p1').classList.add('hide');
 document.getElementById('p2').classList.add('show');
 document.getElementById('texto').innerHTML = `Para vos, que hacés que todo florezca.<br><br>Que esta primavera te regale todos los motivos para sonreír.<br><br><b>Este ramo amarillo es eterno, como mi cariño por vos.</b> 🌼`;
 document.getElementById('de').innerHTML = `Con cariño, ${n} 💛`;
 lanzarRamos();
 setInterval(lanzarRamos, 2500);
}

function lanzarRamos(){
 for(let i=0;i<18;i++){
  setTimeout(()=>{
   let r=document.createElement('div');
   r.className='ramo';
   r.innerText=['💐','🌻','🌼','💛','🌻'][Math.floor(Math.random()*5)];
   r.style.left=Math.random()*100+'vw';
   r.style.fontSize=(25+Math.random()*40)+'px';
   r.style.animationDuration=(2+Math.random()*2)+'s';
   document.getElementById('p2').appendChild(r);
   setTimeout(()=>r.remove(),4000);
  }, i*100);
 }
}
</script>
<style>@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}</style>
</body>
</html>
